# Frozen 3-fold grouped cross-validation — THE ARTIFACT OF RECORD.
#
# 18 training subjects. Each fold holds out 3 from Block I (users 1-9) and 3
# from Block II (users 16-24), training on the other 12. Every subject is
# validated exactly once, so the fold-mean is a leave-6-out estimate over the
# whole training population rather than a lucky sample.
#
# IMMUTABLE. Decision D5 keeps this split exactly as written: no re-roll, no
# enlargement. One re-roll was permitted before the first logged experiment and
# is not being used. Do not edit this file. If a change is ever agreed, it needs
# a new file and a recorded reason, not an edit here.
#
# The seed alone is NOT a reproduction recipe -- the result is order-sensitive
# (shuffling Block II first, using two generators, or shuffling Python lists
# rather than arrays each give different folds). The generator is therefore
# recorded verbatim below.
#
# VERIFIED 2026-08-12: the generator was re-run on Python 3.12 / numpy 2.x and
# reproduces the three validation sets below exactly, all three folds. The union
# of the validation sets is all 18 subjects with no repeats.
#
#     rng = numpy.random.default_rng(20260811)
#     a = list(range(1, 10));   rng.shuffle(a)     # Block I  subjects
#     b = list(range(16, 25));  rng.shuffle(b)     # Block II subjects
#     fold_k.val = sorted(a[3*k : 3*k+3] + b[3*k : 3*k+3])

seed: 20260811
n_folds: 3

blocks:
  I:  [1, 2, 3, 4, 5, 6, 7, 8, 9]
  II: [16, 17, 18, 19, 20, 21, 22, 23, 24]

folds:
  - fold: 0
    val:   [4, 5, 9, 21, 22, 24]
    train: [1, 2, 3, 6, 7, 8, 16, 17, 18, 19, 20, 23]
  - fold: 1
    val:   [2, 6, 8, 17, 18, 19]
    train: [1, 3, 4, 5, 7, 9, 16, 20, 21, 22, 23, 24]
  - fold: 2
    val:   [1, 3, 7, 16, 20, 23]
    train: [2, 4, 5, 6, 8, 9, 17, 18, 19, 21, 22, 24]

# Diagnostic-only splits. These NEVER select a model; they are reported.
#
# leave_one_block_out measures cross-room transfer, which the frozen folds
# deliberately destroy by balancing blocks in every fold. Two runs, finalists
# only.
#
# leave_one_campaign_out is a LOOSE GROUPING OF USERS, not a date partition.
# Users 1, 2 and 3 each recorded in both May and June, so this diagnostic is
# contaminated for those three and must be reported with that caveat. The
# earlier claim that users partition cleanly by campaign was measured from one
# stream's filenames and was retracted.
diagnostic_splits:
  leave_one_block_out:
    - train_block: I
      val_block: II
    - train_block: II
      val_block: I
  leave_one_campaign_out:
    may_a:  [1, 2, 3, 4, 5]
    may_b:  [6, 7, 8, 9]
    june_a: [16, 17, 18, 19, 20]
    june_b: [21, 22, 23, 24]

# Known unmeasurable cells, from the per-fold per-class support audit:
#   fold 1 x class 25 -> validation support 0 (class 25 has 12 clips, 3 users)
#   fold 0 x class 35 -> validation support 3
# Folds 0 and 1 each validate on zero clips from one whole campaign; only
# fold 2 validates across all four. Report per-campaign validation accuracy or
# the CV mean flatters.
